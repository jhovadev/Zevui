# Native runtime gates, not claims of supported platform packaging.
# Windows and macOS remain experimental until each host is validated in CI.
name: SQLite native portability (F6C experimental)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'addons/storage-sqlite/**'
      - 'packages/initializr-core/**'
      - 'templates/**'
      - 'scripts/sqlite_portability_smoke.py'
      - '.github/workflows/sqlite-portability.yml'

jobs:
  sqlite-native:
    name: SQLite ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            experimental: false
            system: true
          - os: windows-latest
            experimental: true
            system: false
          - os: macos-15
            experimental: true
            system: false
          - os: macos-15-intel
            experimental: true
            system: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
      - uses: mlugg/setup-zig@v2
        with:
          version: '0.17.1'
      - name: Install Linux SQLite3 development library
        if: ${{ matrix.system }}
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Install Initializr TypeScript toolchain
        shell: bash
        run: cd apps/initializr && bun install
      - name: Compile canonical Initializr generator
        working-directory: apps/initializr
        shell: bash
        run: bunx tsc -p ../../packages/initializr-core/tsconfig.json
      - name: Run native standalone and generated SQLite tests
        shell: bash
        run: >-
          python scripts/sqlite_portability_smoke.py
          ${{ matrix.system && '--system' || '' }}
      - name: Attempt full native starter GUI compile (experimental)
        shell: bash
        continue-on-error: true
        run: >-
          python scripts/sqlite_portability_smoke.py --gui
          ${{ matrix.system && '--system' || '' }}
